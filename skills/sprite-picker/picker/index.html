<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>스프라이트 피커</title>
  <link rel="stylesheet" href="picker.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎨</span>
      <div class="titles">
        <h1 id="title">스프라이트 피커</h1>
        <p id="subtitle" class="muted">고를 스프라이트를 클릭하세요. 선택은 자동 저장됩니다.</p>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-group="catalog">카탈로그 <span class="count" data-count="catalog">0</span></button>
      <button class="tab" data-group="library">이전 사용 <span class="count" data-count="library">0</span></button>
      <button class="tab" data-group="candidate">이번 후보 <span class="count" data-count="candidate">0</span></button>
    </div>
  </header>

  <section class="filters" id="filters">
    <input type="search" id="search" placeholder="이름·태그·소스 검색 (예: 캐릭터, run, kenney)" autocomplete="off" />
    <div class="chips" id="styleChips" data-facet="style"></div>
    <div class="chips" id="typeChips" data-facet="contentType"></div>
    <div class="chips" id="tierChips" data-facet="safetyTier"></div>
  </section>

  <main id="gallery" class="gallery" aria-live="polite"></main>

  <footer class="tray" id="tray">
    <div class="tray-head">
      <strong>선택됨 <span id="selCount">0</span>개</strong>
      <div class="tray-actions">
        <button id="clearBtn" class="btn ghost" type="button">전체 해제</button>
        <button id="copyBtn" class="btn primary" type="button">선택 코드 복사</button>
      </div>
    </div>
    <div id="selList" class="sel-list"></div>
    <label class="note-label" for="note">메모(선택) — 어디에 쓸지·요청사항을 적으면 Claude가 함께 읽습니다.</label>
    <textarea id="note" rows="2" placeholder="예: 첫 줄 캐릭터를 플레이어로, 슬라임을 적으로. 코인은 노란색으로 톤 맞춰줘."></textarea>
    <details class="token-wrap">
      <summary>선택 코드(복사·붙여넣기 폴백)</summary>
      <textarea id="token" rows="5" readonly aria-label="선택 코드 JSON"></textarea>
      <p class="muted small">Claude가 브라우저를 직접 읽지 못하면, 이 코드를 복사해 채팅창에 붙여넣어 주세요.</p>
    </details>
  </footer>

  <script src="data.js" onerror="window.__noData=true"></script>
  <script src="picker.js"></script>
</body>
</html>
