<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 모바일 웹뷰 대응: 노치 영역까지 확장 + 핀치/더블탭 줌 차단 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a1f">
<link rel="icon" href="data:,">
<title>Runeburst — 별무리 매치</title>
<style>
  /* 모바일 웹뷰 CSS 리셋 (러버밴드/스크롤/탭하이라이트/롱프레스 메뉴 차단) */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed; inset: 0;
    /* 딥 스페이스 그라데이션 (네온 글로우가 도드라지는 어두운 배경) */
    background: radial-gradient(120% 90% at 50% 8%, #1a1640 0%, #100c2c 42%, #07061a 100%);
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #game { width: 100%; height: 100dvh; height: 100svh; }
  /* 스무스(벡터) 렌더 — 픽셀 게임과 달리 image-rendering 지정 안 함 */
  #game canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<div id="game"></div>
<!-- vendored Phaser 4.1.0 (MIT) + 엔진 라이브러리(전부 로컬, 오프라인 동작) -->
<!-- 미려한 스무스/벡터 네온 글로우 스타일이므로 pixelforge 대신 vectorforge 로드 -->

<script src="../../engine/audio.js"></script>

<script src="../../engine/mobile.js"></script>
<script src="game.js"></script>
</body>
</html>
