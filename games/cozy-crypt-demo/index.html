<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 모바일 웹뷰 대응: 노치 영역까지 확장 + 핀치/더블탭 줌 차단 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#171320">
<title>COZY CRYPT — style-architect 데모</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed; inset: 0;
    background: #120e1a;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #game { width: 100%; height: 100dvh; height: 100svh; }
  /* 픽셀 스타일 게임 → 픽셀화(안티앨리어싱 금지) */
  #game canvas { display: block; touch-action: none; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<!-- vendored Phaser 4.1.0 (MIT) + 엔진 라이브러리(전부 로컬, 오프라인 동작) -->
<script src="../../engine/phaser.min.js"></script>
<script src="../../engine/pixelforge.js"></script>
<!-- 무드 배선용 킷(WebGL 전용 — Canvas 면 StyleKit 이 폴백) -->
<script src="../../engine/screenfx.js"></script>
<script src="../../engine/lightingkit.js"></script>
<!-- style-architect 어댑터: style.json → 팔레트·라이팅·포스트FX 일관 배선 -->
<script src="../../engine/stylekit.js"></script>
<script src="game.js"></script>
</body>
</html>
