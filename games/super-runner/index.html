<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 모바일 웹뷰 대응: 노치 영역까지 확장 + 핀치/더블탭 줌 차단 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5c94fc">
<title>SUPER RUNNER</title>
<style>
  /* 모바일 웹뷰 CSS 리셋 (러버밴드/스크롤/탭하이라이트/롱프레스 메뉴 차단) */
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed; inset: 0;
    background: #000;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #game { width: 100%; height: 100dvh; height: 100svh; }
  #game canvas { display: block; touch-action: none; image-rendering: pixelated; }
</style>
</head>
<body>
<div id="game"></div>
<!-- vendored Phaser 3.90 (MIT) + 엔진 라이브러리(전부 로컬, 오프라인 동작) -->
<script src="../../engine/phaser.min.js"></script>
<script src="../../engine/pixelforge.js"></script>
<script src="../../engine/audio.js"></script>
<script src="../../engine/mobile.js"></script>
<script src="game.js"></script>
</body>
</html>
